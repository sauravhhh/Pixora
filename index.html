<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora — Photo Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0c0c0f;
            --panel: #141418;
            --panel-2: #1c1c22;
            --panel-3: #26262e;
            --hairline: rgba(255, 255, 255, 0.08);
            --text: #f5f5f7;
            --text-2: #a7a7ae;
            --text-3: #6e6e76;
            --accent: #4d8dff;
            --accent-soft: rgba(77, 141, 255, 0.14);
            --danger: #ff453a;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            height: 100dvh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Top bar ---------- */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--hairline);
            z-index: 50;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4d8dff, #8b5cf6);
            color: #fff;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(77, 141, 255, 0.35);
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .top-actions {
            display: none;
            align-items: center;
            gap: 2px;
        }

        body.editing .top-actions {
            display: flex;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-2);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .icon-btn:hover {
            background: var(--panel-2);
            color: var(--text);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        .save-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            padding: 9px 16px;
            border-radius: 20px;
            margin-left: 6px;
            box-shadow: 0 4px 14px rgba(77, 141, 255, 0.35);
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .save-btn:hover {
            box-shadow: 0 6px 18px rgba(77, 141, 255, 0.45);
        }

        .save-btn:active {
            transform: scale(0.96);
        }

        .save-btn i {
            font-size: 13px;
        }

        /* ---------- Upload ---------- */

        .upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 20px;
            border: 1.5px dashed rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            cursor: pointer;
            padding: 48px 24px;
            text-align: center;
            background: var(--panel);
            transition: border-color 0.25s, background 0.25s;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: #15151b;
        }

        .upload-area.hidden {
            display: none;
        }

        .upload-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 4px;
        }

        .upload-content h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-content p {
            color: var(--text-2);
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        /* ---------- Stage ---------- */

        .canvas-container {
            flex: 1;
            min-height: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
            position: relative;
        }

        .canvas-container.active {
            display: flex;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 44px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--hairline);
            max-width: 100%;
            max-height: 100%;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        .crop-overlay {
            position: absolute;
            border: 1.5px solid var(--accent);
            background: rgba(77, 141, 255, 0.08);
            cursor: move;
            display: none;
            border-radius: 6px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
        }

        .crop-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border: 2px solid var(--accent);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .crop-handle.nw { top: -8px; left: -8px; cursor: nw-resize; }
        .crop-handle.ne { top: -8px; right: -8px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -8px; left: -8px; cursor: sw-resize; }
        .crop-handle.se { bottom: -8px; right: -8px; cursor: se-resize; }
        .crop-handle.n { top: -8px; left: 50%; margin-left: -8px; cursor: n-resize; }
        .crop-handle.s { bottom: -8px; left: 50%; margin-left: -8px; cursor: s-resize; }
        .crop-handle.e { right: -8px; top: 50%; margin-top: -8px; cursor: e-resize; }
        .crop-handle.w { left: -8px; top: 50%; margin-top: -8px; cursor: w-resize; }

        /* ---------- Dock ---------- */

        .controls {
            display: none;
            flex-shrink: 0;
            background: rgba(20, 20, 24, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--hairline);
            border-radius: 20px 20px 0 0;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .controls.active {
            display: block;
        }

        .tab-navigation {
            display: flex;
            padding: 10px 12px 2px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-3);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 4px 12px;
            font-size: 11px;
            font-weight: 500;
            font-family: inherit;
            border-radius: 12px;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn i {
            font-size: 19px;
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 22px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent);
        }

        .tab-pages {
            max-height: 36vh;
            overflow-y: auto;
            padding: 8px 18px 14px;
            scrollbar-width: thin;
            scrollbar-color: #33333c transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Sliders ---------- */

        .ctl {
            margin-bottom: 14px;
        }

        .ctl:last-child {
            margin-bottom: 4px;
        }

        .ctl-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .ctl-head label {
            font-size: 14px;
            font-weight: 500;
        }

        .value-display {
            font-size: 13px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 30px;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: #33333c;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            margin-top: -9px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: none;
        }

        input[type="range"]::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: #33333c;
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* ---------- Filters ---------- */

        .filter-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 6px 2px 14px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-option {
            flex: 0 0 auto;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
        }

        .filter-preview {
            width: 66px;
            height: 66px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .filter-option:hover .filter-preview {
            transform: scale(1.05);
        }

        .filter-option.active .filter-preview {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(77, 141, 255, 0.25);
        }

        .filter-name {
            font-size: 12px;
            color: var(--text-2);
            font-weight: 500;
        }

        .filter-option.active .filter-name {
            color: var(--text);
        }

        .f-none { background: linear-gradient(135deg, #3a3a42, #17171b); }
        .f-vintage { background: linear-gradient(135deg, #d9b98c, #6e5233); }
        .f-monochrome { background: linear-gradient(135deg, #f2f2f2, #3a3a3a); }
        .f-sepia { background: linear-gradient(135deg, #eac484, #6b4a26); }
        .f-dramatic { background: linear-gradient(135deg, #46587e, #0b1220); }
        .f-vivid { background: linear-gradient(135deg, #ff6b81, #ffb347); }
        .f-cool { background: linear-gradient(135deg, #8fd3f4, #2c4a73); }
        .f-warm { background: linear-gradient(135deg, #ffc46b, #e2703a); }

        /* ---------- Tools ---------- */

        .tool-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 6px 0 18px;
        }

        .tool-btn {
            background: var(--panel-2);
            border: 1.5px solid transparent;
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-2);
            transition: all 0.2s;
        }

        .tool-btn i {
            font-size: 20px;
        }

        .tool-btn:hover {
            background: var(--panel-3);
            color: var(--text);
        }

        .tool-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: none;
            padding: 0;
            flex-shrink: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--hairline);
            border-radius: 12px;
        }

        input[type="color"]::-moz-color-swatch {
            border: 1px solid var(--hairline);
            border-radius: 12px;
        }

        .preset-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-color {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--hairline);
            transition: transform 0.15s;
        }

        .preset-color:hover {
            transform: scale(1.12);
        }

        /* ---------- Effects ---------- */

        .enhance-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(77, 141, 255, 0.35);
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.15s;
        }

        .enhance-btn:hover {
            background: rgba(77, 141, 255, 0.22);
        }

        .enhance-btn:active {
            transform: scale(0.98);
        }

        /* ---------- Loading & toast ---------- */

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
        }

        .loading-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-2);
            border: 1px solid var(--hairline);
            padding: 28px 36px;
            border-radius: 18px;
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #33333c;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }

        .loading p {
            font-size: 14px;
            color: var(--text-2);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%) translateY(12px);
            background: #26262e;
            color: var(--text);
            border: 1px solid var(--hairline);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 768px) {
            .tab-pages {
                max-height: 40vh;
                max-width: 720px;
                margin: 0 auto;
            }

            .upload-area {
                max-width: 560px;
                margin: 32px auto;
                width: calc(100% - 40px);
            }

            .topbar {
                padding: 10px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"><i class="fas fa-wand-magic-sparkles"></i></span>
                <span class="brand-name">Pixora</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" onclick="undo()" aria-label="Undo"><i class="fas fa-undo"></i></button>
                <button class="icon-btn" onclick="redo()" aria-label="Redo"><i class="fas fa-redo"></i></button>
                <button class="icon-btn" onclick="resetImage()" aria-label="Reset"><i class="fas fa-arrow-rotate-left"></i></button>
                <button class="save-btn" onclick="downloadImage()"><i class="fas fa-download"></i><span>Save</span></button>
            </div>
        </header>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon"><i class="fas fa-image"></i></div>
            <div class="upload-content">
                <h2>Choose a photo</h2>
                <p>Tap to browse or drag and drop</p>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
                <div class="crop-overlay" id="cropOverlay">
                    <div class="crop-handle nw"></div>
                    <div class="crop-handle ne"></div>
                    <div class="crop-handle sw"></div>
                    <div class="crop-handle se"></div>
                    <div class="crop-handle n"></div>
                    <div class="crop-handle s"></div>
                    <div class="crop-handle e"></div>
                    <div class="crop-handle w"></div>
                </div>
            </div>
        </div>

        <div class="controls" id="controls">
            <nav class="tab-navigation">
                <button class="tab-btn active" onclick="switchTab('adjust', this)"><i class="fas fa-sliders"></i><span>Adjust</span></button>
                <button class="tab-btn" onclick="switchTab('filters', this)"><i class="fas fa-layer-group"></i><span>Filters</span></button>
                <button class="tab-btn" onclick="switchTab('tools', this)"><i class="fas fa-screwdriver-wrench"></i><span>Tools</span></button>
                <button class="tab-btn" onclick="switchTab('effects', this)"><i class="fas fa-wand-magic-sparkles"></i><span>Effects</span></button>
            </nav>

            <div class="tab-pages">
                <div class="tab-content active" id="adjust">
                    <div class="ctl">
                        <div class="ctl-head"><label>Exposure</label><span class="value-display" id="exposureValue">0</span></div>
                        <input type="range" id="exposure" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Brightness</label><span class="value-display" id="brightnessValue">100</span></div>
                        <input type="range" id="brightness" min="0" max="200" value="100">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Highlights</label><span class="value-display" id="highlightsValue">0</span></div>
                        <input type="range" id="highlights" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Shadows</label><span class="value-display" id="shadowsValue">0</span></div>
                        <input type="range" id="shadows" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Contrast</label><span class="value-display" id="contrastValue">100</span></div>
                        <input type="range" id="contrast" min="0" max="200" value="100">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Saturation</label><span class="value-display" id="saturationValue">100</span></div>
                        <input type="range" id="saturation" min="0" max="200" value="100">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Vibrance</label><span class="value-display" id="vibranceValue">0</span></div>
                        <input type="range" id="vibrance" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Warmth</label><span class="value-display" id="warmthValue">0</span></div>
                        <input type="range" id="warmth" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Tint</label><span class="value-display" id="tintValue">0</span></div>
                        <input type="range" id="tint" min="-100" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Sharpness</label><span class="value-display" id="sharpnessValue">0</span></div>
                        <input type="range" id="sharpness" min="0" max="100" value="0">
                    </div>
                </div>

                <div class="tab-content" id="filters">
                    <div class="filter-row">
                        <div class="filter-option active" onclick="applyFilter('none', this)"><span class="filter-preview f-none"></span><span class="filter-name">Original</span></div>
                        <div class="filter-option" onclick="applyFilter('vintage', this)"><span class="filter-preview f-vintage"></span><span class="filter-name">Vintage</span></div>
                        <div class="filter-option" onclick="applyFilter('monochrome', this)"><span class="filter-preview f-monochrome"></span><span class="filter-name">B&amp;W</span></div>
                        <div class="filter-option" onclick="applyFilter('sepia', this)"><span class="filter-preview f-sepia"></span><span class="filter-name">Sepia</span></div>
                        <div class="filter-option" onclick="applyFilter('dramatic', this)"><span class="filter-preview f-dramatic"></span><span class="filter-name">Dramatic</span></div>
                        <div class="filter-option" onclick="applyFilter('vivid', this)"><span class="filter-preview f-vivid"></span><span class="filter-name">Vivid</span></div>
                        <div class="filter-option" onclick="applyFilter('cool', this)"><span class="filter-preview f-cool"></span><span class="filter-name">Cool</span></div>
                        <div class="filter-option" onclick="applyFilter('warm', this)"><span class="filter-preview f-warm"></span><span class="filter-name">Warm</span></div>
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Intensity</label><span class="value-display" id="filterIntensityValue">100</span></div>
                        <input type="range" id="filterIntensity" min="0" max="100" value="100">
                    </div>
                </div>

                <div class="tab-content" id="tools">
                    <div class="tool-buttons">
                        <div class="tool-btn" id="cropBtn" onclick="toggleCrop()"><i class="fas fa-crop"></i><span>Crop</span></div>
                        <div class="tool-btn" onclick="rotateImage()"><i class="fas fa-rotate-right"></i><span>Rotate</span></div>
                        <div class="tool-btn" onclick="flipHorizontal()"><i class="fas fa-left-right"></i><span>Flip H</span></div>
                        <div class="tool-btn" onclick="flipVertical()"><i class="fas fa-up-down"></i><span>Flip V</span></div>
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Background</label></div>
                        <div class="color-picker-container">
                            <input type="color" id="bgColor" value="#ffffff">
                            <div class="preset-colors">
                                <div class="preset-color" style="background: #ffffff" onclick="setBgColor('#ffffff')"></div>
                                <div class="preset-color" style="background: #000000" onclick="setBgColor('#000000')"></div>
                                <div class="preset-color" style="background: #ff0000" onclick="setBgColor('#ff0000')"></div>
                                <div class="preset-color" style="background: #00ff00" onclick="setBgColor('#00ff00')"></div>
                                <div class="preset-color" style="background: #0000ff" onclick="setBgColor('#0000ff')"></div>
                                <div class="preset-color" style="background: #ffff00" onclick="setBgColor('#ffff00')"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="effects">
                    <div class="ctl">
                        <div class="ctl-head"><label>Blur</label><span class="value-display" id="blurValue">0</span></div>
                        <input type="range" id="blur" min="0" max="20" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Noise</label><span class="value-display" id="noiseValue">0</span></div>
                        <input type="range" id="noise" min="0" max="100" value="0">
                    </div>
                    <div class="ctl">
                        <div class="ctl-head"><label>Vignette</label><span class="value-display" id="vignetteValue">0</span></div>
                        <input type="range" id="vignette" min="0" max="100" value="0">
                    </div>
                    <button class="enhance-btn" onclick="enhancePhoto()"><i class="fas fa-wand-magic-sparkles"></i> AI Enhance</button>
                </div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <p>Processing your photo...</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        let canvas, ctx, originalImage, currentImage;
        let cropMode = false;
        let cropData = { x: 0, y: 0, width: 0, height: 0 };
        let currentFilter = 'none';
        let history = [];
        let historyIndex = -1;
        let isDragging = false;
        let dragHandle = null;
        let dragStart = { x: 0, y: 0 };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            setupEventListeners();
        });

        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');

            // File upload
            fileInput.addEventListener('change', handleFileSelect);
            uploadArea.addEventListener('click', () => fileInput.click());

            // Drag and drop
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.transform = 'translateY(-2px)';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.transform = 'translateY(0)';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.transform = 'translateY(0)';
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            // Sliders
            setupSliders();
            
            // Crop functionality
            setupCropHandlers();
        }

        function setupSliders() {
            const sliders = [
                'exposure', 'brightness', 'highlights', 'shadows', 'contrast', 
                'saturation', 'vibrance', 'warmth', 'tint', 'sharpness', 
                'blur', 'noise', 'vignette', 'filterIntensity'
            ];
            
            sliders.forEach(slider => {
                const element = document.getElementById(slider);
                if (element) {
                    const display = document.getElementById(slider + 'Value');
                    
                    element.addEventListener('input', function() {
                        display.textContent = this.value;
                        applyAllEffects();
                    });
                }
            });
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                toast('Please select an image file');
                return;
            }

            showLoading();
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    loadImage(img);
                    hideLoading();
                };
                img.onerror = function() {
                    hideLoading();
                    toast('Error loading image');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadImage(img) {
            originalImage = img;
            currentImage = img;

            // Calculate canvas size
            const maxWidth = Math.min(window.innerWidth - 40, 800);
            const maxHeight = window.innerHeight * 0.6;
            
            let { width, height } = calculateDimensions(img.width, img.height, maxWidth, maxHeight);
            
            canvas.width = width;
            canvas.height = height;

            // Reset history
            history = [];
            historyIndex = -1;
            saveToHistory();

            drawImage();

            // Show editor
            document.getElementById('uploadArea').classList.add('hidden');
            document.getElementById('canvasContainer').classList.add('active');
            document.getElementById('controls').classList.add('active');
            document.body.classList.add('editing');

            // Reset all controls
            resetControls();
        }

        function calculateDimensions(imgWidth, imgHeight, maxWidth, maxHeight) {
            let width = imgWidth;
            let height = imgHeight;

            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }

            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }

            return { width: Math.round(width), height: Math.round(height) };
        }

        function drawImage() {
            if (!currentImage) return;
            
            const bgColor = document.getElementById('bgColor').value;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
        }

        function applyAllEffects() {
            if (!originalImage) return;

            // Get all slider values
            const exposure = parseFloat(document.getElementById('exposure').value);
            const brightness = parseFloat(document.getElementById('brightness').value);
            const highlights = parseFloat(document.getElementById('highlights').value);
            const shadows = parseFloat(document.getElementById('shadows').value);
            const contrast = parseFloat(document.getElementById('contrast').value);
            const saturation = parseFloat(document.getElementById('saturation').value);
            const vibrance = parseFloat(document.getElementById('vibrance').value);
            const warmth = parseFloat(document.getElementById('warmth').value);
            const tint = parseFloat(document.getElementById('tint').value);
            const blur = parseFloat(document.getElementById('blur').value);
            const filterIntensity = parseFloat(document.getElementById('filterIntensity').value);

            // Create filter string
            let filters = [];
            
            // Basic adjustments
            if (brightness !== 100) filters.push(`brightness(${brightness}%)`);
            if (contrast !== 100) filters.push(`contrast(${contrast}%)`);
            if (saturation !== 100) filters.push(`saturate(${saturation}%)`);
            
            // Advanced adjustments (approximated with CSS filters)
            if (exposure !== 0) {
                const exposureValue = 100 + exposure;
                filters.push(`brightness(${exposureValue}%)`);
            }
            
            if (warmth !== 0) {
                const hue = warmth * 0.3; // Convert to hue rotation
                filters.push(`hue-rotate(${hue}deg)`);
            }
            
            if (blur > 0) filters.push(`blur(${blur}px)`);

            // Apply current filter
            const filterEffects = getFilterEffects(currentFilter, filterIntensity);
            filters = filters.concat(filterEffects);

            ctx.filter = filters.join(' ') || 'none';
            drawImage();
            
            // Apply post-processing effects
            applyPostEffects();
            
            ctx.filter = 'none';
        }

        function applyPostEffects() {
            const noise = parseFloat(document.getElementById('noise').value);
            const vignette = parseFloat(document.getElementById('vignette').value);
            
            if (noise > 0) {
                applyNoise(noise);
            }
            
            if (vignette > 0) {
                applyVignette(vignette);
            }
        }

        function applyNoise(intensity) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * intensity * 2;
                data[i] = Math.max(0, Math.min(255, data[i] + noise));     // Red
                data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise)); // Green
                data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise)); // Blue
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        function applyVignette(intensity) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.sqrt(centerX * centerX + centerY * centerY);
            
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, `rgba(0, 0, 0, 0)`);
            gradient.addColorStop(1, `rgba(0, 0, 0, ${intensity / 100})`);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function getFilterEffects(filterName, intensity) {
            const i = intensity / 100;
            
            switch (filterName) {
                case 'vintage':
                    return [`sepia(${30 * i}%)`, `contrast(${100 + 20 * i}%)`, `saturate(${80 + 20 * i}%)`];
                case 'monochrome':
                    return [`grayscale(${100 * i}%)`];
                case 'sepia':
                    return [`sepia(${100 * i}%)`];
                case 'dramatic':
                    return [`contrast(${100 + 50 * i}%)`, `saturate(${100 + 30 * i}%)`, `brightness(${90 + 10 * i}%)`];
                case 'vivid':
                    return [`saturate(${100 + 50 * i}%)`, `contrast(${100 + 20 * i}%)`];
                case 'cool':
                    return [`hue-rotate(${-20 * i}deg)`, `saturate(${100 + 10 * i}%)`];
                case 'warm':
                    return [`hue-rotate(${20 * i}deg)`, `saturate(${100 + 20 * i}%)`];
                default:
                    return [];
            }
        }

        function applyFilter(filterName, el) {
            // Update active filter button
            document.querySelectorAll('.filter-option').forEach(btn => {
                btn.classList.remove('active');
            });
            el.classList.add('active');
            
            currentFilter = filterName;
            applyAllEffects();
        }

        function rotateImage() {
            if (!currentImage) return;
            
            showLoading();
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            // Swap width and height for rotation
            tempCanvas.width = canvas.height;
            tempCanvas.height = canvas.width;
            
            // Rotate 90 degrees clockwise
            tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
            tempCtx.rotate(Math.PI / 2);
            tempCtx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
            
            const newImg = new Image();
            newImg.onload = function() {
                currentImage = newImg;
                canvas.width = tempCanvas.width;
                canvas.height = tempCanvas.height;
                saveToHistory();
                applyAllEffects();
                hideLoading();
            };
            newImg.src = tempCanvas.toDataURL();
        }

        function flipHorizontal() {
            if (!currentImage) return;
            flip(-1, 1);
        }

        function flipVertical() {
            if (!currentImage) return;
            flip(1, -1);
        }

        function flip(scaleX, scaleY) {
            showLoading();
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            
            tempCtx.save();
            tempCtx.scale(scaleX, scaleY);
            tempCtx.drawImage(canvas, 
                scaleX < 0 ? -tempCanvas.width : 0, 
                scaleY < 0 ? -tempCanvas.height : 0
            );
            tempCtx.restore();
            
            const newImg = new Image();
            newImg.onload = function() {
                currentImage = newImg;
                saveToHistory();
                applyAllEffects();
                hideLoading();
            };
            newImg.src = tempCanvas.toDataURL();
        }

        function toggleCrop() {
            cropMode = !cropMode;
            document.getElementById('cropBtn').classList.toggle('active', cropMode);
            const cropOverlay = document.getElementById('cropOverlay');
            
            if (cropMode) {
                showCropOverlay();
            } else {
                applyCrop();
                hideCropOverlay();
            }
        }

        function showCropOverlay() {
            const rect = canvas.getBoundingClientRect();
            const overlay = document.getElementById('cropOverlay');
            
            const cropWidth = Math.min(canvas.width * 0.8, canvas.width - 40);
            const cropHeight = Math.min(canvas.height * 0.8, canvas.height - 40);
            const cropX = (canvas.width - cropWidth) / 2;
            const cropY = (canvas.height - cropHeight) / 2;
            
            overlay.style.left = (rect.left + cropX) + 'px';
            overlay.style.top = (rect.top + cropY) + 'px';
            overlay.style.width = cropWidth + 'px';
            overlay.style.height = cropHeight + 'px';
            overlay.style.display = 'block';
            
            cropData = {
                x: cropX,
                y: cropY,
                width: cropWidth,
                height: cropHeight
            };
        }

        function hideCropOverlay() {
            document.getElementById('cropOverlay').style.display = 'none';
        }

        function setupCropHandlers() {
            const overlay = document.getElementById('cropOverlay');
            const handles = overlay.querySelectorAll('.crop-handle');
            
            // Handle dragging
            overlay.addEventListener('mousedown', startCropDrag);
            overlay.addEventListener('touchstart', startCropDrag);
            
            handles.forEach(handle => {
                handle.addEventListener('mousedown', startHandleDrag);
                handle.addEventListener('touchstart', startHandleDrag);
            });
            
            document.addEventListener('mousemove', cropDrag);
            document.addEventListener('touchmove', cropDrag);
            document.addEventListener('mouseup', stopCropDrag);
            document.addEventListener('touchend', stopCropDrag);
        }

        function startCropDrag(e) {
            if (e.target.classList.contains('crop-handle')) return;
            
            isDragging = true;
            dragHandle = 'move';
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            dragStart = {
                x: clientX - parseFloat(document.getElementById('cropOverlay').style.left),
                y: clientY - parseFloat(document.getElementById('cropOverlay').style.top)
            };
            
            e.preventDefault();
        }

        function startHandleDrag(e) {
            isDragging = true;
            dragHandle = e.target.className.split(' ')[1];
            
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            dragStart = { x: clientX, y: clientY };
            e.preventDefault();
            e.stopPropagation();
        }

        function cropDrag(e) {
            if (!isDragging || !cropMode) return;
            
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const overlay = document.getElementById('cropOverlay');
            const canvasRect = canvas.getBoundingClientRect();
            
            if (dragHandle === 'move') {
                const newX = clientX - dragStart.x;
                const newY = clientY - dragStart.y;
                
                // Constrain to canvas bounds
                const maxX = canvasRect.width - cropData.width;
                const maxY = canvasRect.height - cropData.height;
                
                const constrainedX = Math.max(canvasRect.left, Math.min(newX, canvasRect.left + maxX));
                const constrainedY = Math.max(canvasRect.top, Math.min(newY, canvasRect.top + maxY));
                
                overlay.style.left = constrainedX + 'px';
                overlay.style.top = constrainedY + 'px';
                
                cropData.x = constrainedX - canvasRect.left;
                cropData.y = constrainedY - canvasRect.top;
            } else {
                // Handle resize
                const deltaX = clientX - dragStart.x;
                const deltaY = clientY - dragStart.y;
                
                let newX = cropData.x;
                let newY = cropData.y;
                let newWidth = cropData.width;
                let newHeight = cropData.height;
                
                switch (dragHandle) {
                    case 'nw':
                        newX += deltaX;
                        newY += deltaY;
                        newWidth -= deltaX;
                        newHeight -= deltaY;
                        break;
                    case 'ne':
                        newY += deltaY;
                        newWidth += deltaX;
                        newHeight -= deltaY;
                        break;
                    case 'sw':
                        newX += deltaX;
                        newWidth -= deltaX;
                        newHeight += deltaY;
                        break;
                    case 'se':
                        newWidth += deltaX;
                        newHeight += deltaY;
                        break;
                    case 'n':
                        newY += deltaY;
                        newHeight -= deltaY;
                        break;
                    case 's':
                        newHeight += deltaY;
                        break;
                    case 'e':
                        newWidth += deltaX;
                        break;
                    case 'w':
                        newX += deltaX;
                        newWidth -= deltaX;
                        break;
                }
                
                // Constrain dimensions
                if (newWidth >= 50 && newHeight >= 50 && 
                    newX >= 0 && newY >= 0 && 
                    newX + newWidth <= canvas.width && 
                    newY + newHeight <= canvas.height) {
                    
                    cropData = { x: newX, y: newY, width: newWidth, height: newHeight };
                    
                    overlay.style.left = (canvasRect.left + newX) + 'px';
                    overlay.style.top = (canvasRect.top + newY) + 'px';
                    overlay.style.width = newWidth + 'px';
                    overlay.style.height = newHeight + 'px';
                }
                
                dragStart = { x: clientX, y: clientY };
            }
            
            e.preventDefault();
        }

        function stopCropDrag() {
            isDragging = false;
            dragHandle = null;
        }

        function applyCrop() {
            if (!cropMode || !currentImage) return;
            
            showLoading();
            
            const scaleX = currentImage.width / canvas.width;
            const scaleY = currentImage.height / canvas.height;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = cropData.width;
            tempCanvas.height = cropData.height;
            
            // Draw cropped portion
            tempCtx.drawImage(canvas,
                cropData.x, cropData.y, cropData.width, cropData.height,
                0, 0, cropData.width, cropData.height
            );
            
            const newImg = new Image();
            newImg.onload = function() {
                currentImage = newImg;
                canvas.width = cropData.width;
                canvas.height = cropData.height;
                saveToHistory();
                applyAllEffects();
                hideLoading();
            };
            newImg.src = tempCanvas.toDataURL();
        }

        function switchTab(tabName, el) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            el.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
        }

        function setBgColor(color) {
            document.getElementById('bgColor').value = color;
            applyAllEffects();
        }

        function saveToHistory() {
            if (!canvas) return;
            
            // Remove future history if we're not at the end
            history = history.slice(0, historyIndex + 1);
            
            // Add current state
            history.push(canvas.toDataURL());
            historyIndex++;
            
            // Limit history size
            if (history.length > 20) {
                history.shift();
                historyIndex--;
            }
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreFromHistory();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreFromHistory();
            }
        }

        function restoreFromHistory() {
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                drawImage();
            };
            img.src = history[historyIndex];
        }

        function resetImage() {
            if (!originalImage) return;
            
            currentImage = originalImage;
            const maxWidth = Math.min(window.innerWidth - 40, 800);
            const maxHeight = window.innerHeight * 0.6;
            
            let { width, height } = calculateDimensions(
                originalImage.width, 
                originalImage.height, 
                maxWidth, 
                maxHeight
            );
            
            canvas.width = width;
            canvas.height = height;
            
            resetControls();
            saveToHistory();
            applyAllEffects();
        }

        function resetControls() {
            const controls = {
                'exposure': 0, 'brightness': 100, 'highlights': 0, 'shadows': 0,
                'contrast': 100, 'saturation': 100, 'vibrance': 0, 'warmth': 0,
                'tint': 0, 'sharpness': 0, 'blur': 0, 'noise': 0, 'vignette': 0,
                'filterIntensity': 100
            };
            
            Object.entries(controls).forEach(([id, value]) => {
                const element = document.getElementById(id);
                const display = document.getElementById(id + 'Value');
                if (element && display) {
                    element.value = value;
                    display.textContent = value;
                }
            });
            
            // Reset filter
            currentFilter = 'none';
            document.querySelectorAll('.filter-option').forEach((btn, index) => {
                btn.classList.toggle('active', index === 0);
            });
            
            // Reset background color
            document.getElementById('bgColor').value = '#ffffff';
        }

        async function enhancePhoto() {
            if (!canvas) return;
            
            showLoading();
            
            try {
                // Convert canvas to blob
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                
                // Create form data for API
                const formData = new FormData();
                formData.append('image', blob, 'photo.png');
                formData.append('enhance_type', 'auto');
                
                // Note: This is a placeholder for AI enhancement
                // In a real implementation, you would call an actual AI service
                setTimeout(() => {
                    // Simulate AI enhancement by applying some automatic adjustments
                    document.getElementById('contrast').value = 110;
                    document.getElementById('contrastValue').textContent = '110';
                    document.getElementById('saturation').value = 105;
                    document.getElementById('saturationValue').textContent = '105';
                    document.getElementById('sharpness').value = 15;
                    document.getElementById('sharpnessValue').textContent = '15';
                    
                    saveToHistory();
                    applyAllEffects();
                    hideLoading();
                    
                    toast('Photo enhanced');
                }, 2000);
                
            } catch (error) {
                hideLoading();
                toast('Enhancement failed. Please try again.');
            }
        }

        function downloadImage() {
            if (!canvas) return;
            
            // Get current timestamp for filename
            const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
            
            const link = document.createElement('a');
            link.download = `photo-edit-${timestamp}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            if (currentImage && !cropMode) {
                const maxWidth = Math.min(window.innerWidth - 40, 800);
                const maxHeight = window.innerHeight * 0.6;
                
                let { width, height } = calculateDimensions(
                    currentImage.width, 
                    currentImage.height, 
                    maxWidth, 
                    maxHeight
                );
                
                canvas.width = width;
                canvas.height = height;
                applyAllEffects();
            }
        });

        // Prevent context menu on long press (mobile)
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'CANVAS' || e.target.closest('.crop-overlay')) {
                e.preventDefault();
            }
        });
    </script>
</body>
